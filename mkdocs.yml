site_name: pydelling - Numerical Modeling Toolkit
site_description: Comprehensive Python library for mesh preprocessing and numerical modeling workflows
site_url: !ENV [DOCS_SITE_URL, "https://amphos21-consulting.github.io/pydelling/"]
repo_url: https://github.com/amphos21-consulting/pydelling
repo_name: GitHub Repository
edit_uri: edit/main/docs/

exclude_docs: |
  readers/api.md
  writers/api.md
  preprocessing/api.md
  postprocessing/api.md
  managers/api.md
  interpolation/api.md
  utilities/api.md
  paraview_processor/api.md

# Navigation
nav:
  - Home: index.md
  - Getting Started: 
    - Installation: docs-installation.md
    - Quick Start: docs-getting_started.md
    - Usage Guide: docs-usage.md
  
  - API Reference:
    - Overview: api-reference.md
    - Configuration: config.md
    - Modules: reference/
  
  - Examples:
    - Code Snippets: examples/code-snippets.md
    - Tutorials: examples/tutorials.md
    - Use Cases: examples/use-cases.md
  
  - Development:
    - Contributing: development/contributing.md
    - Development Setup: development/setup.md
    - Testing: development/testing.md
    - GitLab CI Documentation: development/gitlab-ci-docs.md
    - Release Notes: development/releases.md

# Theme configuration
theme:
  name: material
  
  # Theme features
  features:
#    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - toc.integrate
  
  # Color palette
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: pydelling-green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
        primary: deep orange

    
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: pydelling-green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  # Fonts
  font:
    text: Roboto
    code: Roboto Mono
  
  # Logo and favicon
  logo: pydelling_logo_square.png
  favicon: pydelling_logo_square.png
  
  # Language
  language: en

# Extensions
markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      toc_depth: 4
      baselevel: 1
      anchorlink: true
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: amphos21
      repo: pydelling
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Plugins
plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            show_source: false
            show_root_heading: true
            show_root_toc_entry: true
            heading_level: 2
            show_signature_annotations: true
            separate_signature: true
            members_order: alphabetical
            docstring_style: google
            docstring_options:
              ignore_init_summary: true
            merge_init_into_class: true
            show_submodules: true
            show_bases: false
            show_inheritance_diagram: false

# Extra CSS and JavaScript
extra_css:
  - stylesheets/extra.css
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/katex.min.css

extra_javascript:
  - javascripts/sidebar-version.js
  - javascripts/sidebar-nav-toggle.js
  - javascripts/anchor-fix.js
  - javascripts/katex.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/katex.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/contrib/auto-render.min.js

# Extra configuration
extra:
  version:
    provider: mike
  
  social:
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.amphos21.com/aitirga/pydelling
      name: GitLab Repository
    
    - icon: fontawesome/solid/globe
      link: https://amphos21.com
      name: Amphos 21 Website
    
    - icon: fontawesome/solid/envelope
      link: mailto:digital-solutions@amphos21.com
      name: Contact Us

  generator: false

