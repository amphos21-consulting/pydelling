image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

cache:
  paths:
    - .cache/uv

stages:
  - test
  - build
  - build-docs
  - pages
  - mirror

# Test stage with coverage reporting
test-core:
  stage: test
  parallel:
    matrix:
      - UV_PYTHON: ["3.10", "3.12"]
  script:
    - uv sync --locked --group dev
    - uv run pytest pydelling/tests/ --ignore=pydelling/tests/managers/test_comsol_manager.py --cov=pydelling --cov-report=xml --cov-report=html --cov-report=term-missing --junitxml=report.xml -v --tb=short
  
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    paths:
      - coverage.xml
      - report.xml
      - htmlcov/
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

test-cloud:
  stage: test
  script:
    - uv sync --locked --group dev --extra cloud
    - uv run pytest pydelling/tests/ --ignore=pydelling/tests/managers/test_comsol_manager.py -q

test-comsol:
  stage: test
  allow_failure: true
  rules:
    - if: '$COMSOL_TESTS == "1"'
  script:
    - uv sync --locked --group dev --extra comsol
    - uv run pytest pydelling/tests/managers/test_comsol_manager.py -q

# Validate the installable artifact before deployment, including package data.
build-package:
  stage: build
  script:
    - uv build
    - uv run --no-project --with ./dist/pydelling-*.whl python -I -c "from importlib.metadata import version; from pydelling.assets import get_api_catalog; from pydelling.preview import build_asset_preview; assert version('pydelling'); assert get_api_catalog()['schema_version'] == 1"
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

## Documentation build for MR feedback and branch validation
build-docs:
  stage: build-docs
  script:
    - uv sync --locked --group docs
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        uv run mkdocs build --strict --site-dir site
      else
        uv run mkdocs build --site-dir site
      fi
  artifacts:
    name: "docs_$CI_COMMIT_SHORT_SHA"
    paths:
      - site/
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "feat/docs"'

## GitHub Pages deployment from main
deploy-github-pages:
  stage: pages
  image: alpine:3.20
  dependencies:
    - build-docs
  before_script:
    - apk add --no-cache git
  script:
    - cd site
    - touch .nojekyll
    - git init
    - git config user.name "GitLab CI"
    - git config user.email "ci@gitlab.local"
    - git add -A
    - git commit --allow-empty -m "Deploy docs from ${CI_COMMIT_SHORT_SHA}"
    - git branch -M gh-pages
    - git remote add origin https://oauth2:${GITHUB_TOKEN}@github.com/amphos21-consulting/pydelling.git
    - git push --force origin gh-pages
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

## Mirror to GitHub on main branch
mirror-to-github:
  stage: mirror
  image: alpine:3.20
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git
  script:
    - git remote add github https://oauth2:${GITHUB_TOKEN}@github.com/amphos21-consulting/pydelling.git
    - git push github HEAD:refs/heads/main --force
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
