image: python:3.11

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - .venv/

stages:
  - test
  - build-docs
  - pages

# Test stage with coverage reporting
test:
  stage: test
  image: python:3.12

  script:
    - python -m pip install --upgrade pip
    - pip install --cache-dir "$PIP_CACHE_DIR" .
    - mkdir -p htmlcov
    - printf '<coverage version="1"></coverage>' > coverage.xml
    - pytest pydelling/tests/ --cov=pydelling --cov-report=xml --cov-report=html --cov-report=term-missing --junitxml=report.xml -v --tb=short
  
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    paths:
      - coverage.xml
      - report.xml
      - htmlcov/
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

## Documentation build for MR feedback and branch validation
build-docs:
  stage: build-docs
  image: python:3.11
  script:
    - pip install --cache-dir "$PIP_CACHE_DIR" mkdocs mkdocs-material "mkdocstrings[python]" mkdocstrings-python pymdown-extensions mike
    - mkdocs build --site-dir site
  artifacts:
    name: "docs_$CI_COMMIT_SHORT_SHA"
    paths:
      - site/
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "feat/docs"'

## GitLab Pages deployment from main
pages:
  stage: pages
  image: alpine:3.20
  dependencies:
    - build-docs
  script:
    - mkdir -p public
    - cp -r site/* public/
  artifacts:
    paths:
      - public/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
