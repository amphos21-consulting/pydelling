image: python:3.11

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - .venv/

stages:
  - test
  - build-docs
  - pages
  - wiki

# Test stage with coverage reporting
test:
  stage: test
  image: docker:latest
  services:
   - name: docker:dind
     
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""

  script:
    - apk update
    - apk add just
    # Run tests with coverage and copy reports to host (all in one command)
    - just ci-test-reports
  
  after_script:
    - docker compose down --remove-orphans || true
  
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    paths:
      - coverage.xml
      - report.xml
      - htmlcov/
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

