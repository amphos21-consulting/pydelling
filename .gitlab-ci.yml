image: python:3.11

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - .venv/

stages:
  - test
  - build-docs
  - pages
  - mirror

# Test stage with coverage reporting
test:
  stage: test
  image: python:3.12

  script:
    - python -m pip install --upgrade pip
    - pip install --cache-dir "$PIP_CACHE_DIR" .
    - mkdir -p htmlcov
    - printf '<coverage version="1"></coverage>' > coverage.xml
    - pytest pydelling/tests/ --cov=pydelling --cov-report=xml --cov-report=html --cov-report=term-missing --junitxml=report.xml -v --tb=short
  
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    paths:
      - coverage.xml
      - report.xml
      - htmlcov/
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

## Documentation build for MR feedback and branch validation
build-docs:
  stage: build-docs
  image: python:3.11
  script:
    - pip install --cache-dir "$PIP_CACHE_DIR" mkdocs mkdocs-gen-files mkdocs-literate-nav mkdocs-material "mkdocstrings[python]" mkdocstrings-python pymdown-extensions mike
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        mkdocs build --strict --site-dir site
      else
        mkdocs build --site-dir site
      fi
  artifacts:
    name: "docs_$CI_COMMIT_SHORT_SHA"
    paths:
      - site/
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "feat/docs"'

## GitHub Pages deployment from main
deploy-github-pages:
  stage: pages
  image: alpine:3.20
  dependencies:
    - build-docs
  before_script:
    - apk add --no-cache git
  script:
    - cd site
    - touch .nojekyll
    - git init
    - git config user.name "GitLab CI"
    - git config user.email "ci@gitlab.local"
    - git add -A
    - git commit --allow-empty -m "Deploy docs from ${CI_COMMIT_SHORT_SHA}"
    - git branch -M gh-pages
    - git remote add origin https://oauth2:${GITHUB_TOKEN}@github.com/amphos21-consulting/pydelling.git
    - git push --force origin gh-pages
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

## Mirror to GitHub on main branch
mirror-to-github:
  stage: mirror
  image: alpine:3.20
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git
  script:
    - git remote add github https://oauth2:${GITHUB_TOKEN}@github.com/amphos21-consulting/pydelling.git
    - git push github HEAD:refs/heads/main --force
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
